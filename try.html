<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application</title>
  <style>
    :root {
      --primary-color: #4a6cf7;
      --primary-dark: #3a56d4;
      --secondary-color: #6c757d;
      --success-color: #28a745;
      --light-bg: #f8f9fa;
      --dark-text: #343a40;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .application-section {
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }
    
    .application-container {
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 15px 35px var(--shadow-color),
        0 5px 15px rgba(0, 0, 0, 0.07);
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .application-container:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 20px 40px var(--shadow-color),
        0 10px 20px rgba(0, 0, 0, 0.1);
    }
    
    .section-title {
      color: var(--dark-text);
      padding: 25px 0;
      margin: 0;
      background: var(--light-bg);
      font-weight: 600;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    
    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background-color: var(--primary-color);
    }
    
    .application-form {
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--dark-text);
      transition: all 0.3s;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }
    
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.25);
      outline: none;
    }
    
    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }
    
    .form-text {
      margin-top: 5px;
      display: block;
      font-size: 13px;
      color: var(--secondary-color);
    }
    
    .submit-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: block;
      width: 100%;
      box-shadow: 0 4px 12px rgba(74, 108, 247, 0.4);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background-color: var(--primary-dark);
      transition: width 0.3s ease;
      z-index: -1;
    }
    
    .submit-btn:hover::before {
      width: 100%;
    }
    
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(74, 108, 247, 0.5);
    }
    
    .submit-btn:active {
      transform: translateY(1px);
    }
    
    .form-status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-weight: 500;
    }
    
    .form-status.success {
      background-color: rgba(40, 167, 69, 0.1);
      color: var(--success-color);
      border: 1px solid rgba(40, 167, 69, 0.2);
      display: block;
    }
    
    .form-status.error {
      background-color: rgba(220, 53, 69, 0.1);
      color: #dc3545;
      border: 1px solid rgba(220, 53, 69, 0.2);
      display: block;
    }
    
    /* 3D form field effect */
    .form-group.focus-within {
      transform: translateZ(10px);
    }
    
    /* Input animation */
    @keyframes inputFocus {
      0% { transform: scale(1); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    
    .form-control:focus {
      animation: inputFocus 0.3s ease;
    }
    
    /* Required field indicator */
    label::after {
      content: ' *';
      color: #dc3545;
      display: none;
    }
    
    label[for="name"]::after,
    label[for="email"]::after,
    label[for="phone"]::after,
    label[for="cover-letter"]::after,
    label[for="experience"]::after {
      display: inline;
    }
    
    /* Loading spinner for form submission */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    @keyframes spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }
    
    .submit-btn.loading {
      padding-right: 40px;
    }
    
    .submit-btn.loading .spinner {
      display: block;
    }
    
    /* Field completion animation */
    @keyframes fieldComplete {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .field-complete {
      animation: fieldComplete 0.5s ease;
      border-color: var(--success-color) !important;
    }
  </style>
</head>
<body>
  <div class="application-section">
    <div class="application-container">
      <h2 class="section-title" style="text-align: center;">Apply Now</h2>
      
      <form class="application-form" id="application-form" enctype="multipart/form-data">
        <!-- Hidden field to store the job title -->
        <input type="hidden" name="job_title" id="job-title-field" value="General Application">
        
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" required>
        </div>
        
        <!-- Resume Link Field -->
        <div class="form-group">
          <label for="resume-link">Resume Link</label>
          <input type="url" id="resume-link" name="resume_link" class="form-control" placeholder="URL to your resume (Google Drive Link)">
          <small class="form-text text-muted">If you have your resume hosted online, you can provide the link here.</small>
        </div>
        
        <div class="form-group">
          <label for="linkedin">LinkedIn Profile</label>
          <input type="url" id="linkedin" name="linkedin" class="form-control">
        </div>
        
        <div class="form-group">
          <label for="cover-letter">Why are you interested in this position?</label>
          <textarea id="cover-letter" name="cover_letter" class="form-control" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="experience">Relevant Experience</label>
          <textarea id="experience" name="experience" class="form-control" required></textarea>
        </div>
        
        <button type="submit" class="submit-btn">
          Submit Application
          <span class="spinner"></span>
        </button>
        
        <div id="form-status" class="form-status"></div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Focus and blur effects for form groups
      const formControls = document.querySelectorAll('.form-control');
      
      formControls.forEach(control => {
        control.addEventListener('focus', function() {
          this.closest('.form-group').classList.add('focus-within');
        });
        
        control.addEventListener('blur', function() {
          this.closest('.form-group').classList.remove('focus-within');
          
          // Add completion animation if field has content
          if (this.value.trim() !== '') {
            this.classList.add('field-complete');
            setTimeout(() => {
              this.classList.remove('field-complete');
            }, 500);
          }
        });
      });
      
      // Form submission with animation
      const form = document.getElementById('application-form');
      const submitBtn = form.querySelector('.submit-btn');
      const formStatus = document.getElementById('form-status');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Add loading state
        submitBtn.classList.add('loading');
        
        // Simulate form submission (replace with actual submission logic)
        setTimeout(() => {
          // Remove loading state
          submitBtn.classList.remove('loading');
          
          // Show success message
          formStatus.textContent = "Application submitted successfully! We'll be in touch soon.";
          formStatus.classList.add('success');
          
          // Reset form after delay
          setTimeout(() => {
            form.reset();
            formStatus.classList.remove('success');
          }, 5000);
        }, 1500);
      });
      
      // 3D tilt effect on container
      const container = document.querySelector('.application-container');
      
      container.addEventListener('mousemove', function(e) {
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const xRotation = ((y - rect.height / 2) / rect.height) * 4;
        const yRotation = ((x - rect.width / 2) / rect.width) * -4;
        
        container.style.transform = `perspective(1000px) rotateX(${xRotation}deg) rotateY(${yRotation}deg) translateY(-5px)`;
      });
      
      container.addEventListener('mouseleave', function() {
        container.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
      });
    });
  </script>
</body>
</html>
